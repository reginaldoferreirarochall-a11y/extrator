name: Atualizar lista

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extrator
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar lista
        run: |
          npm install --no-save @neondatabase/serverless
          node leads.js
      - name: Publicar lista
        run: |
          git config user.name "Extrator"
          git config user.email "actions@github.com"
          git add docs/leads.json
          git commit -m "Lista atualizada" || echo "sem mudanças"
          git push
