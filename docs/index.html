<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extrator de Leads</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#0a0a0b;color:#f5f5f4}
  main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-.5px}
  .sub{color:#9c9ca3;font-size:15px;margin:0 0 20px;line-height:1.5}
  .card{background:#141417;border:1px solid #26262b;border-radius:20px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:700;color:#9c9ca3;margin:14px 0 6px;letter-spacing:.4px}
  label:first-child{margin-top:0}
  input{width:100%;background:#0a0a0b;border:1px solid #3a3a41;border-radius:12px;color:#f5f5f4;
    font-size:17px;padding:14px}
  button{width:100%;background:#fff;color:#0a0a0b;border:0;border-radius:999px;font-size:17px;
    font-weight:800;padding:16px;margin-top:18px;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  .ghost{background:transparent;color:#f5f5f4;border:1px solid #3a3a41}
  #status{font-size:15px;color:#facc15;min-height:22px;margin:14px 2px 0;line-height:1.5}
  .lead{background:#141417;border:1px solid #26262b;border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer}
  .lead:active{border-color:#f5f5f4}
  .lead h2{font-size:17px;margin:0 0 4px}
  .lead p{margin:0;color:#9c9ca3;font-size:15px;line-height:1.5}
  .lead .tel{color:#f5f5f4;font-weight:700;font-size:17px}
  .count{color:#9c9ca3;font-size:14px;margin:18px 2px 10px}
  .copied{color:#4ade80 !important}
</style>
</head>
<body>
<main>
  <h1>Extrator de Leads</h1>
  <p class="sub">Digite o tipo de loja e a cidade. Eu busco no Google Maps e trago os telefones.</p>

  <div class="card">
    <label for="nicho">TIPO DE LOJA</label>
    <input id="nicho" placeholder="Ex.: vidraçaria" autocomplete="off">
    <label for="regiao">CIDADE / REGIÃO</label>
    <input id="regiao" placeholder="Ex.: Suzano SP" autocomplete="off">
    <label for="qtd">QUANTOS CONTATOS</label>
    <input id="qtd" type="number" value="20" min="1" max="120">
    <button id="extrair">Extrair contatos</button>
    <p id="status"></p>
    <div id="tokenBox" style="display:none">
      <label for="token">CHAVE DE ACESSO (só na primeira vez)</label>
      <input id="token" type="password" placeholder="Cole a chave aqui" autocomplete="off">
      <button class="ghost" id="salvarToken">Salvar chave</button>
    </div>
  </div>

  <div class="card">
    <label for="busca">PROCURAR NA LISTA</label>
    <input id="busca" placeholder="Nome da loja ou cidade" autocomplete="off">
    <button class="ghost" id="csv">Baixar lista (CSV)</button>
  </div>

  <p class="count" id="count"></p>
  <div id="lista"></div>
</main>

<script>
const REPO = 'reginaldoferreirarochall-a11y/extrator';
const $ = id => document.getElementById(id);
let leads = [], geradoEm = null, esperando = null;

const fmt = t => {
  const d = String(t || '').replace(/\D/g, '').replace(/^55/, '');
  return d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`
       : d.length === 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : t;
};

function render() {
  const q = $('busca').value.trim().toLowerCase();
  const vis = leads.filter(l => !q || (l.nome||'').toLowerCase().includes(q) || (l.cidade||'').toLowerCase().includes(q));
  $('count').textContent = leads.length ? `${vis.length} de ${leads.length} contatos — toque num contato pra copiar o número` : 'Nenhum contato ainda. Faça a primeira busca acima.';
  $('lista').innerHTML = vis.map(l => `
    <div class="lead" data-tel="${String(l.telefone).replace(/\D/g,'')}">
      <h2>${(l.nome||'').replace(/</g,'&lt;')}</h2>
      <p>${(l.cidade||'').replace(/</g,'&lt;')}${l.avaliacao ? ' · Nota ' + l.avaliacao : ''}</p>
      <p class="tel">${fmt(l.telefone)}</p>
    </div>`).join('');
  document.querySelectorAll('.lead').forEach(el => el.onclick = async () => {
    const num = fmt(el.dataset.tel);
    try { await navigator.clipboard.writeText(num); } catch(e) {}
    const tel = el.querySelector('.tel'); const antes = tel.textContent;
    tel.textContent = 'Copiado: ' + num; tel.classList.add('copied');
    setTimeout(() => { tel.textContent = antes; tel.classList.remove('copied'); }, 1600);
  });
}

async function carregar() {
  try {
    const r = await fetch('leads.json?t=' + Date.now());
    const j = await r.json();
    leads = j.leads || []; geradoEm = j.generated_at;
    render();
    return leads.length;
  } catch(e) { return leads.length; }
}

$('busca').addEventListener('input', render);
$('csv').onclick = () => {
  const linhas = [['nome','telefone','cidade','endereco','avaliacao'],
    ...leads.map(l => [l.nome, fmt(l.telefone), l.cidade||'', l.endereco||'', l.avaliacao||''])];
  const csv = linhas.map(l => l.map(v => '"' + String(v??'').replace(/"/g,'""') + '"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv'}));
  a.download = 'contatos.csv'; a.click(); URL.revokeObjectURL(a.href);
};

$('salvarToken').onclick = () => {
  const t = $('token').value.trim();
  if (!t) return;
  localStorage.setItem('extrator_token', t);
  $('tokenBox').style.display = 'none';
  $('status').textContent = 'Chave salva. Agora é só clicar em Extrair contatos.';
};

$('extrair').onclick = async () => {
  const nicho = $('nicho').value.trim(), regiao = $('regiao').value.trim();
  const qtd = String(Math.max(1, Math.min(120, parseInt($('qtd').value || '20', 10))));
  if (!nicho || !regiao) { $('status').textContent = 'Preencha o tipo de loja e a cidade.'; return; }
  const token = localStorage.getItem('extrator_token');
  if (!token) { $('tokenBox').style.display = 'block'; $('status').textContent = 'Primeira vez: cole a chave de acesso abaixo (uma vez só).'; return; }

  const antes = leads.length, geradoAntes = geradoEm;
  $('extrair').disabled = true;
  $('status').textContent = 'Buscando, leva uns 2 minutos… pode deixar esta tela aberta.';
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/extract.yml/dispatches`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main', inputs: { nicho, regiao, qtd } })
    });
    if (r.status === 401 || r.status === 403 || r.status === 404) {
      localStorage.removeItem('extrator_token'); $('tokenBox').style.display = 'block';
      throw new Error('A chave não foi aceita. Cole a chave nova abaixo.');
    }
    if (!r.ok && r.status !== 204) throw new Error('Não consegui começar a busca. Tente de novo.');
  } catch(e) {
    $('status').textContent = e.message; $('extrair').disabled = false; return;
  }

  clearInterval(esperando);
  let tentativas = 0;
  esperando = setInterval(async () => {
    tentativas++;
    await carregar();
    if (geradoEm && geradoEm !== geradoAntes) {
      clearInterval(esperando); $('extrair').disabled = false;
      const novos = leads.length - antes;
      $('status').textContent = novos > 0 ? `Pronto! ${novos} contato(s) novo(s) na lista.` : 'Pronto! Busca feita — nenhum contato novo (os que apareceram já estavam na lista).';
    } else if (tentativas >= 15) {
      clearInterval(esperando); $('extrair').disabled = false;
      $('status').textContent = 'Está demorando mais que o normal. Espere um pouco e toque na tela de novo — a lista se atualiza sozinha.';
    }
  }, 20000);
};

carregar();
</script>
</body>
</html>
